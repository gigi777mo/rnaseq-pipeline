name: rnaseq
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pandas
  - numpy
  - pyyaml
  - snakemake >=8.0
  # QC & trimming
  - fastqc
  - multiqc
  - fastp
  # Quantification
  - salmon >=1.10
  - star >=2.7.11
  - subread
  - samtools
  # R & Bioconductor
  - r-base >=4.3
  - r-tidyverse
  - r-ggplot2
  - r-pheatmap
  - r-optparse
  - r-matrixstats
  - bioconductor-deseq2
  - bioconductor-tximport
  - bioconductor-tximeta
  - bioconductor-enhancedvolcano
  - bioconductor-apeglm
  - bioconductor-ruvseq
  - bioconductor-edger
  - bioconductor-eeseq
