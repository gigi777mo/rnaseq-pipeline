# RNA-seq pipeline configuration

# Reference
genome: human
quantifier: salmon               # salmon (recommended) or star

# Paths
salmon_index: "/path/to/salmon_index"
star_index: "/path/to/star_index"
gtf: "/path/to/genes.gtf"

# Sample sheet
samples: "data/samples.csv"

# ---------- Quality Control ----------
qc:
  run_fastqc: true
  run_multiqc: true
  min_reads: 1000000
  min_mapping_rate: 0.5

# ---------- Spike-in controls ----------
spikein:
  enabled: false
  type: ERCC
  fasta: "/path/to/ERCC92.fa"
  concentration_table: ""
  id_prefix: "ERCC-"
  # Simple alternative to full RUV (generally less powerful than RUVg)
  normalization: none            # none | size_factor

# ---------- RUVSeq (Remove Unwanted Variation) ----------
# Full control of RUVg / RUVs / RUVr
ruv:
  enabled: false                 # set true to run RUV normalization / factor estimation
  method: ruvg                   # ruvg | ruvs | ruvr
  k: 1                           # number of unwanted factors to estimate
  # For RUVg: how to define negative control genes
  #   spikein  – use transcripts matching spikein.id_prefix
  #   empirical – least DE genes from a first-pass analysis
  #   custom   – supply a file of gene/transcript IDs
  controls: spikein              # spikein | empirical | custom
  custom_controls_file: ""       # path to txt/csv of control IDs (one per line) if controls: custom
  # For RUVs: column in samples.csv that defines replicate groups
  replicate_column: ""           # e.g. patient_id or lib_id
  # Whether to add estimated W factors into the DESeq2 design
  add_to_design: true
  # Produce diagnostic plots (RLE + PCA before/after)
  diagnostics: true

# Trimming (fastp)
fastp:
  qualified_quality_phred: 20
  length_required: 30
  detect_adapter_for_pe: true

# Salmon
salmon:
  libtype: "A"
  extra: "--gcBias --seqBias"

# STAR
star:
  extra: ""

# DESeq2
deseq2:
  design: "~ condition"
  reference_level: "control"
  fdr_cutoff: 0.05
  lfc_cutoff: 1.0
  min_counts: 10

# Resources
resources:
  threads: 8
  memory_gb: 32
