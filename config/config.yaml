# RNA-seq pipeline configuration

# Reference
genome: human
quantifier: salmon               # salmon (recommended) or star

# Paths
salmon_index: "/path/to/salmon_index"
star_index: "/path/to/star_index"
gtf: "/path/to/genes.gtf"

# Sample sheet
samples: "data/samples.csv"

# ---------- Quality Control ----------
qc:
  run_fastqc: true
  run_multiqc: true
  min_reads: 1000000
  min_mapping_rate: 0.5

# ---------- Spike-in controls ----------
spikein:
  enabled: false
  type: ERCC
  fasta: "/path/to/ERCC92.fa"
  concentration_table: ""
  id_prefix: "ERCC-"
  normalization: none            # none | size_factor

# ---------- RUVSeq (Remove Unwanted Variation) ----------
ruv:
  enabled: false
  method: ruvg                   # ruvg | ruvs | ruvr
  k: 1
  controls: spikein              # spikein | empirical | custom
  custom_controls_file: ""
  replicate_column: ""
  add_to_design: true
  diagnostics: true

# ---------- SVA / svaseq / ComBat-seq ----------
sva:
  enabled: false
  method: svaseq                 # svaseq | combat_seq
  n_sv: null                     # null = estimate with num.sv; or integer
  num_sv_method: be              # be | leek
  batch_column: batch            # for combat_seq (must exist in samples.csv)
  add_to_design: true
  diagnostics: true

# Trimming (fastp)
fastp:
  qualified_quality_phred: 20
  length_required: 30
  detect_adapter_for_pe: true

# Salmon
salmon:
  libtype: "A"
  extra: "--gcBias --seqBias"

# STAR
star:
  extra: ""

# DESeq2
deseq2:
  design: "~ condition"
  reference_level: "control"
  fdr_cutoff: 0.05
  lfc_cutoff: 1.0
  min_counts: 10

# Resources
resources:
  threads: 8
  memory_gb: 32
